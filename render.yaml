databases:
  - name: tcf-postgres
    databaseName: tcf_canada
    user: tcf_canada

services:
  - type: web
    name: tcf-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://tcf-trainer.onrender.com
      # MCP server (Grok): the public address of this backend, used for download links.
      - key: PUBLIC_BASE_URL
        value: https://tcf-mvp.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: tcf-postgres
          property: connectionString
      # One or two background generators. More than that runs several ffmpeg jobs at boot and the
      # instance is killed (instant 502s). Missing this variable is safe: the code defaults to 2.
      - key: PREGEN_WORKERS
        value: "2"
      - key: FFMPEG_CONCURRENCY
        value: "1"

  - type: web
    name: tcf-trainer
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://tcf-mvp.onrender.com
