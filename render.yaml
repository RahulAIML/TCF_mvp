databases:
  - name: tcf-postgres
    databaseName: tcf_canada
    user: tcf_canada

services:
  - type: web
    name: tcf-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # One process. Audio jobs live in memory, so a second worker would lose them.
    # Heavy TTS/ffmpeg is capped inside the process (HEAVY_WORKERS, FFMPEG_CONCURRENCY).
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --timeout-keep-alive 5
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://tcf-trainer.onrender.com
      # MCP server (Grok): the public address of this backend, used for download links.
      - key: PUBLIC_BASE_URL
        value: https://tcf-mvp.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: tcf-postgres
          property: connectionString
      # Background generation on this 512 MB instance was crash-looping the process
      # (instant 502s from the proxy). Leave it off; a request still generates when asked.
      - key: PREGEN_ENABLED
        value: "0"
      - key: PREGEN_WORKERS
        value: "1"
      - key: HEAVY_WORKERS
        value: "1"
      - key: FFMPEG_CONCURRENCY
        value: "1"
      - key: WEB_CONCURRENCY
        value: "1"

  - type: web
    name: tcf-trainer
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://tcf-mvp.onrender.com
